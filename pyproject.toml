[project]
name = "kaufland-receipts"
version = "0.1.0"
description = "Pull your own Kaufland digital receipts into local structured data."
readme = "README.md"
authors = [
    { name = "André Cedik", email = "andre.cedik@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13.4",
    "pypdf>=6.16.1",
    "typer>=0.12",
    "fastapi>=0.121",
    "uvicorn[standard]>=0.35",
    "python-multipart>=0.0.20",
    "httpx>=0.28",
]

[project.scripts]
kaufland = "kaufland_receipts.cli:app"
kaufland-receipts = "kaufland_receipts.cli:app"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
